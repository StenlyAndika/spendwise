name: spendwise
description: Spendwise - personal expense tracker
publish_to: 'none'

# Version is overridden by `flutter build --build-name/--build-number` when needed.
# Android maps this to versionName / versionCode.
version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  intl: ^0.20.3
  fl_chart: ^0.70.2
  flutter_bloc: ^9.1.0
  equatable: ^2.0.7
  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  file_picker: ^8.1.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  # Android-only project: desktop, web, and Apple targets are intentionally not
  # scaffolded. Re-add one with `flutter create --platforms=<name> .`.
  config:
    enable-swift-package-manager: false

  uses-material-design: true
